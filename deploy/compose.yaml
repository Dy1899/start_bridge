services:
  signaling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 8787
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      TURN_URLS: turn:${DOMAIN:?Set DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      STUN_URL: stun:${DOMAIN}:3478
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [signaling]
  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP:?Set PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --dtls=0
      - --cli=0
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --user-quota=4
      - --total-quota=64
volumes:
  caddy_data:
  caddy_config:
